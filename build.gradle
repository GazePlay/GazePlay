plugins {
    id 'application'
    id 'distribution'
    id 'jacoco'
    alias(libs.plugins.javafx)
    alias(libs.plugins.lombok)
    alias(libs.plugins.license.report)
    alias(libs.plugins.spotbugs)
    alias(libs.plugins.release)
    alias(libs.plugins.download)
}

// The code is compiled for Java 25 (options.release below): an older JDK cannot compile it. Clear message instead of
// "invalid target release: 25" (IntelliJ: Settings > Build Tools > Gradle > Gradle JVM)
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
    throw new GradleException("GazePlay needs a JDK 25 or newer to build, Gradle runs on Java ${JavaVersion.current()} " +
        "(JAVA_HOME, or the Gradle JVM in the settings of IntelliJ)")
}

// Same JavaFX modules as the subprojects: needed by "./gradlew run" (it used to fail with an empty --add-modules)
javafx {
    version = libs.versions.javafx.get()
    modules = ['javafx.controls', 'javafx.swing', 'javafx.media']
}

spotbugsMain.enabled = true
spotbugsTest.enabled = false

logging.captureStandardOutput LogLevel.INFO

// Licenses of all the libraries shipped with GazePlay (build/reports/dependency-license, included in the distributions)
licenseReport {
    // The runtime classpath of the root project is exactly what is shipped (it depends on every module); resolving
    // the configurations of the subprojects from this task is not allowed in parallel builds
    projects = [project]
    configurations = ['runtimeClasspath']
}

apply from: "${rootDir}/gradle/package.gradle"
apply from: "${rootDir}/gradle/installer.gradle"
apply from: "${rootDir}/gradle/jre.gradle"
apply from: "${rootDir}/gradle/drivers.gradle"

allprojects {
    group = 'com.github.gazeplay'

    repositories {
        mavenCentral()

        // Only for the GazePlay builds of the Tobii wrapper (com.github.GazePlay:TobiiStreamEngineForJava)
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroup 'com.github.GazePlay'
            }
        }
    }
}

// The JavaFX test JVMs of the modules run one at a time: running them concurrently made the JavaFX toolkit crash
// now and then (native crash once on JDK 17, cascade of PulseReceiver errors once on JDK 21). Compilation stays parallel.
abstract class JavaFxTestsLimiter implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {
}
def javaFxTestsLimiter = gradle.sharedServices.registerIfAbsent('javaFxTests', JavaFxTestsLimiter) {
    maxParallelUsages = 1
}

subprojects {
    // Explicit access to the version catalog (implicit lookup in the parent project is deprecated)
    def libs = rootProject.extensions.getByName('libs')

    // gazeplay-results holds the computations of the results and must stay free of JavaFX (checked at compilation)
    def usesJavaFx = project.name != 'gazeplay-results'

    apply plugin: 'java'
    apply plugin: 'jacoco'
    if (usesJavaFx) {
        apply plugin: 'org.openjfx.javafxplugin'
    }
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'com.github.spotbugs'
    apply plugin: "pmd"
    apply plugin: 'distribution'

    apply from: "${rootDir}/gradle/pmd.gradle"

    lombok {
        // 1.18.30+ is required by JDK 21, 1.18.40+ by JDK 25
        version = libs.versions.lombok.get()
    }

    if (usesJavaFx) {
        javafx {
            version = libs.versions.javafx.get()
            // javafx.web (WebKit) was only used by the removed LatestNewsPopup
            modules = ['javafx.controls', 'javafx.swing', 'javafx.media']
        }
    }

    spotbugs {
        toolVersion = libs.versions.spotbugs.get()
        excludeFilter = file("spotbugs-exclude.xml")
    }

    spotbugsMain.enabled = true
    spotbugsTest.enabled = false

    dependencies {
        // Every module logs through SLF4J (Lombok @Slf4j); only the application (core) ships logback
        implementation libs.slf4j.api
        testRuntimeOnly libs.logback.classic

        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupiter
        testRuntimeOnly libs.junit.platform.launcher
        testImplementation libs.testfx.core
        testImplementation libs.testfx.junit5
        testImplementation libs.openjfx.monocle
        testImplementation libs.mockito.core
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Bytecode and API of Java 25 (LTS), the Java of all the bundled runtimes, whatever the JDK running the build
        options.release = 25
    }

    test {
        useJUnitPlatform()
        if (project.hasProperty('excludeTests')) {
            exclude project.property('excludeTests')
        }
    }

    tasks.withType(Test).configureEach {
        usesService(javaFxTestsLimiter)
        maxHeapSize = "3g"

        // Hermetic tests: never read or write the real ~/GazePlay folder, nor depend on the edition file
        // (argsGazeplay.txt) of the machine running the build. A fresh home is created for each run.
        def testHome = layout.buildDirectory.dir("test-home/${name}").get().asFile
        systemProperty 'user.home', testHome.absolutePath
        systemProperty 'gazeplay.argsFile', new File(testHome, 'argsGazeplay.txt').absolutePath
        // JavaFX runs without any window (Monocle) unless -Pgui is given, e.g. to watch a test while debugging.
        // AWT (screen recording, robot) is not affected and still needs a display (xvfb in the CI).
        if (!project.hasProperty('gui')) {
            systemProperty 'testfx.robot', 'glass'
            systemProperty 'testfx.headless', 'true'
            systemProperty 'glass.platform', 'Monocle'
            systemProperty 'monocle.platform', 'Headless'
            systemProperty 'prism.order', 'sw'
            systemProperty 'prism.text', 't2k'
            // Monocle extends internal classes of JavaFX: needed when JavaFX is loaded as named modules (e.g. JDK 21)
            jvmArgs '--add-exports', 'javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
                '--add-opens', 'javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.util=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.logging=ALL-UNNAMED'
        }
        doFirst {
            testHome.deleteDir()
            testHome.mkdirs()
            new File(testHome, 'argsGazeplay.txt').setText('gazeplay', 'UTF-8')
        }
    }

    jacoco {
        toolVersion = libs.versions.jacoco.get()
    }

    tasks.jacocoTestReport.dependsOn('test')
}

dependencies {
    implementation project(':gazeplay-core')
    implementation project(':gazeplay-games')
    implementation project(':gazeplay-games-commons')
    implementation project(':gazeplay-commons')

}

// JAVE (AOI videos) ships ffmpeg for 6 platforms, about 20 MB each: each distribution keeps only the binary of its
// platform (JAVE selects it from os.name/os.arch at runtime). The macOS runtime is x64: osx64, not osxm1.
def onlyJaveNativeBinary = { String platform ->
    return { FileTreeElement element ->
        element.name.startsWith('jave-nativebin-') && !element.name.startsWith("jave-nativebin-${platform}-")
    }
}

distributions {
    noJRE {
        setDistributionBaseName "${project.name}-no-jre"
        contents {
            with distributions.main.contents
            from("build/reports")
            from("build/bin") {
                into 'bin'
            }
        }
    }

    windows {
        setDistributionBaseName "${project.name}-windows-x64"
        contents {
            with distributions.main.contents
            exclude onlyJaveNativeBinary('win64')
            from("build/reports")
            from("build/bin/gazeplay-windows.bat") {
                into 'bin'
            }
            from("build/jre/windows-x64") {
                into 'lib/jre'
            }
        }
    }

    linux {
        setDistributionBaseName "${project.name}-linux-x64"
        contents {
            with distributions.main.contents
            exclude onlyJaveNativeBinary('linux64')
            from("build/reports")
            from("build/bin/gazeplay-linux.sh") {
                into 'bin'
            }
            from("build/jre/linux-x64") {
                into 'lib/jre'
            }
            from("build/tobiiDrivers") {
                into 'tobiiDrivers'
            }
        }
    }

    arm {
        setDistributionBaseName "${project.name}-arm"
        contents {
            with distributions.main.contents
            exclude onlyJaveNativeBinary('linux-arm64')
            from("build/reports")
            from("build/bin/gazeplay-arm.sh") {
                into 'bin'
            }
            from("build/jre/arm") {
                into 'lib/jre'
            }
        }
    }

    macos {
        setDistributionBaseName "${project.name}-macos"
        contents {
            with distributions.main.contents
            exclude onlyJaveNativeBinary('osx64')
            from("build/reports")
            from("build/bin/gazeplay-macos.sh") {
                into 'bin'
            }
            from("build/jre/macos") {
                into 'lib/jre'
            }
        }
    }

    // Apple Silicon: same launch scripts, native runtime and ffmpeg (the x64 one needs Rosetta 2)
    macosAarch64 {
        setDistributionBaseName "${project.name}-macos-aarch64"
        contents {
            with distributions.main.contents
            exclude onlyJaveNativeBinary('osxm1')
            from("build/reports")
            from("build/bin/gazeplay-macos.sh") {
                into 'bin'
            }
            from("build/jre/macos-aarch64") {
                into 'lib/jre'
            }
        }
    }
}

task('downloadAndExtractLinuxDependecies').dependsOn('downloadAndExtractLinuxJREwithLibavPlugin', 'downloadAndExtractTobiiDriversForLinux')
task('downloadAndExtractARMDependecies').dependsOn('downloadAndExtractARMJREwithLibavPlugin')

windowsDistZip.dependsOn(downloadAndExtractWindowsJRE)
linuxDistTar.dependsOn(downloadAndExtractLinuxDependecies)
macosDistTar.dependsOn(downloadAndExtractMacosJRE)
macosAarch64DistTar.dependsOn(downloadAndExtractMacosAarch64JRE)

tasks.named('armDistZip') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
    dependsOn tasks.named('extractARMJRE')
    dependsOn tasks.named('unzipDistribution')
}

tasks.named('armDistTar') {
    dependsOn tasks.named('downloadAndExtractARMDependecies')
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
}

tasks.named('noJREDistTar') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
}

tasks.named('noJREDistZip') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
}

tasks.named('linuxDistZip') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
    dependsOn tasks.named('extractLinuxJRE')
    dependsOn tasks.named('extractTobiiDriversForLinux')
    dependsOn tasks.named('unzipDistribution')
}

tasks.named('linuxDistTar') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
}

tasks.named('macosDistZip') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
    dependsOn tasks.named('extractMacosJRE')
    dependsOn tasks.named('unzipDistribution')
}

tasks.named('macosDistTar') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
}

tasks.named('macosAarch64DistZip') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
    dependsOn tasks.named('downloadAndExtractMacosAarch64JRE')
}

tasks.named('macosAarch64DistTar') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
}

tasks.named('windowsDistZip') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
}

tasks.named('windowsDistTar') {
    dependsOn tasks.named('generateLicenseReport')
    dependsOn tasks.named('scriptsForRelease')
    dependsOn tasks.named('extractWindowsJRE')
}

tasks.withType(Tar){
    compression = Compression.GZIP
    archiveExtension.set('tar.gz')
}

distZip {
    duplicatesStrategy = 'exclude'
}

release {
    failOnPublishNeeded = false
    failOnCommitNeeded = false
}

application {
    mainClass = 'net.gazeplay.GazePlayLauncher'
}

defaultTasks 'clean', 'build', 'checkPMDReport'
startScripts.enabled = false

afterReleaseBuild.dependsOn generateWindowsInstallerInDocker
