def downloadLocation = project.ext.downloadLocation

def jreSource = project.ext.jreSource
def zuluVersion = project.ext.zuluVersion
def jreVersion = project.ext.jreVersion
def jreFolder = project.ext.jreFolder
def jre = project.ext.jre

// One set of tasks per architecture: macOS x64 (tasks ...MacosJRE, folder build/jre/macos, unchanged names) and Apple
// Silicon (tasks ...MacosAarch64JRE, folder build/jre/macos-aarch64)
def registerMacosRuntime = { String taskSuffix, String zuluArch, String folderName ->
    def filename = "zulu${zuluVersion}-ca-fx-jre${jreVersion}-macosx_${zuluArch}"

    def download = tasks.register("download${taskSuffix}", Download) {
        group = 'custom jre'
        src "${jreSource}/${filename}.tar.gz"
        dest new File("${downloadLocation}/jre", "${filename}.tar.gz")
        overwrite false
        doLast { verifyChecksum(dest) }
    }

    def extract = tasks.register("extract${taskSuffix}", Copy) {
        group = 'custom jre'
        dependsOn download
        from { tarTree(download.get().dest) }
        into "${jreFolder}/${folderName}"
    }

    tasks.register("downloadAndExtract${taskSuffix}") {
        group = 'custom jre'
        dependsOn extract
        doLast {
            // The Zulu 17 archives hold the runtime in zulu-17.jre/Contents/Home, the Zulu 21 ones directly in
            // Contents/Home. A missing folder used to give an empty runtime without any error.
            def home = ["${jreFolder}/${folderName}/${filename}/zulu-${jre}.jre/Contents/Home",
                        "${jreFolder}/${folderName}/${filename}/Contents/Home"]
                .collect { file(it) }.find { new File(it, 'bin/java').isFile() }
            // Already moved by a previous build, the extraction being up to date (it only checks its own files)
            if (home == null && file("${jreFolder}/${folderName}/bin/java").isFile()) {
                return
            }
            if (home == null) {
                throw new GradleException("No Java runtime (Contents/Home/bin/java) found in ${filename}")
            }
            copy {
                from home
                into "${jreFolder}/${folderName}"
            }

            delete "${jreFolder}/${folderName}/${filename}"
        }
    }
}

registerMacosRuntime('MacosJRE', 'x64', 'macos')
registerMacosRuntime('MacosAarch64JRE', 'aarch64', 'macos-aarch64')
