import java.security.DigestInputStream
import java.security.MessageDigest

// Java runtimes bundled with the distributions: Azul Zulu 25 (LTS, supported until 2033) with JavaFX. The code is
// compiled for Java 25 against JavaFX libs.versions.javafx (21.x, the oldest API it supports, see BUILD.MD): the no-JRE
// distribution runs with Java 25 and JavaFX 21 or newer. Check lib/javafx.properties of a runtime for its JavaFX.
// 64 bits only (Windows x64, Linux x64, Linux aarch64, macOS x64 and aarch64): the 32 bits builds were dropped in October 2026.
ext.jreSource = 'https://cdn.azul.com/zulu/bin'
ext.zuluVersion = '25.36.205'
ext.jreVersion = '25.0.4.1'
ext.jre = '25'
ext.jreFolder = "${buildDir}/jre"

ext.downloadLocation = new File(System.getProperty('user.home'), '.m2/repository').getAbsolutePath()
// (same folder as before, without declaring mavenLocal() as a dependency repository)

// SHA-256 published by Azul for each archive; the Tobii drivers have no published checksum, the
// value is the one of the release asset downloaded on 2026-10-20. Archives are cached under their own name, so that
// a version change can no longer reuse a previous download.
ext.downloadChecksums = [
    'zulu25.36.205-ca-fx-jre25.0.4.1-win_x64.zip'          : '06b91e1e223b29859c8f9d8b3d282fdd1dfa4b313580bcc1d81f2bd08b6521a4',
    'zulu25.36.205-ca-fx-jre25.0.4.1-linux_x64.tar.gz'     : '270ee89dfba987bbd2e16dc3c6e47a4c6c282ff777cf6f06c143de38eb10c1e2',
    'zulu25.36.205-ca-fx-jre25.0.4.1-macosx_x64.tar.gz'    : 'a2c03421cfaf12d4125c1990581d8c75aa136899c37c8fae1de0c571d748dc13',
    'zulu25.36.205-ca-fx-jre25.0.4.1-macosx_aarch64.tar.gz': 'dc9ff518dc170f2f7c3a9cc452555845f2d73e176f9c5ec8bc7793072ed2ca7b',
    'zulu25.36.205-ca-fx-jre25.0.4.1-linux_aarch64.tar.gz' : '9a1b93b5218d426b5c14392518eb2cc3158b67d764fd96f51036d1aa8bfee231',
]

ext.verifyChecksum = { File file ->
    def expected = downloadChecksums[file.name]
    if (expected == null) {
        throw new GradleException("No checksum declared in gradle/jre.gradle for ${file.name}")
    }
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        new DigestInputStream(input, digest).withStream { stream ->
            byte[] buffer = new byte[65536]
            while (stream.read(buffer) != -1) {
            }
        }
    }
    def actual = digest.digest().encodeHex().toString()
    if (actual != expected) {
        file.delete()
        throw new GradleException("Checksum mismatch for ${file.name}: expected ${expected}, got ${actual} (file deleted)")
    }
}

apply from: "${rootDir}/gradle/jre/linux.gradle"
apply from: "${rootDir}/gradle/jre/macos.gradle"
apply from: "${rootDir}/gradle/jre/windows.gradle"
apply from: "${rootDir}/gradle/jre/arm.gradle"

task('downloadAndExtractJREs', group: 'custom jre') {
    dependsOn downloadAndExtractLinuxJREwithLibavPlugin, downloadAndExtractWindowsJRE, downloadAndExtractMacosJRE, downloadAndExtractMacosAarch64JRE, downloadAndExtractARMJREwithLibavPlugin
}
