// -----------------------------------  Windows 64 bits  ---------------------------------------------------------- //

// The Windows distribution is unzipped in its own folder of build/ for Inno Setup: unzipped into build/ itself, the
// whole build folder was the output of unzipDistribution and overlapped the outputs of the other tasks (rejected by
// Gradle 9, e.g. by ./gradlew build)
def installerInputDir = "innosetup-input"

// Exec tasks: the exec {} method of the scripts no longer exists in task actions since Gradle 9
task generateWindowsInstaller(type: Exec, dependsOn: ['unzipDistribution', 'prepareInnoSetupFiles'], group: 'distribution') {
    // I'm leaving this line in so we can quickly sign installers if/when we decide to do so.
    // def signtool = "/SStandard=\"C:\\Program Files (x86)\\Windows Kits\\10\\bin\\10.0.18362.0\\x64\\signtool.exe sign /a /n \$qGazePlay\$q /tr http://timestamp.comodoca.com/ /d \$qGazePlay\$q \$f\""
    commandLine "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe", "${buildDir}\\innosetup\\setup.iss"
}

task generateWindowsInstallerInDocker(type: Exec, dependsOn: ['unzipDistribution', 'prepareInnoSetupFiles'], group: 'distribution') {
    workingDir rootDir
    commandLine "docker", "run", "--rm", "-i", "-v", "${buildDir}:/work", "amake/innosetup", "innosetup/setup.iss"
}

task prepareInnoSetupFiles(group: 'distribution') {
    doLast {
        def innoSetupDir = new File("${buildDir}/innosetup")

        innoSetupDir.mkdir()

        copy {
            from("${rootDir}/gradle/innosetup/setup.iss.skel")
            rename("setup.iss.skel", "setup.iss")
            expand([
                    applicationVersion: "${version}",
                    unpackedDirectory : "${installerInputDir}\\\\${project.name}-windows-x64-${version}"
            ])
            into(innoSetupDir)
        }

        copy {
            from("${rootDir}/gradle/templates/licence.txt")
            expand([
                    version: version,
                    "date"   : new Date().format('yyyy-MM-dd')
            ])
            into(innoSetupDir)
        }

        copy {
            from("${rootDir}/gradle/innosetup/gazeplayicon.ico")
            into(innoSetupDir)
        }

        copy {
            from("${rootDir}/gradle/innosetup/gazeplayicon.bmp")
            into(innoSetupDir)
        }
    }
}

task unzipDistribution(dependsOn: ['packageApp'], type: Copy, group: 'distribution') {
    from zipTree("${buildDir}/distributions/${project.name}-windows-x64-${version}.zip")
    into "${buildDir}/${installerInputDir}"
    filePermissions { unix(0777) }
    dirPermissions { unix(0777) }
}

