# Versions of the libraries and plugins used by GazePlay, in one place.
# See MODERNIZATION.md for the reasons of each choice before upgrading.

[versions]
# Same JavaFX as the bundled runtimes (Zulu 17 FX): compiling against a newer JavaFX allowed APIs absent at runtime
javafx = "17.0.20"
slf4j = "2.0.20"
logback = "1.6.5"
lombok = "1.18.48"
jacoco = "0.8.15"
spotbugs = "4.10.5"
junit = "6.1.3"
testfx = "4.0.18"
# 21.x requires a Java 21 runtime for the tests
monocle = "17.0.10"
mockito = "5.24.0"
# 4.x: the Windows 32 bits binary is gone, it is no longer needed (64 bits distributions only)
jave = "4.2.0"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-jcl = { module = "org.slf4j:jcl-over-slf4j", version.ref = "slf4j" }
slf4j-log4j = { module = "org.slf4j:log4j-over-slf4j", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
sysout-over-slf4j = { module = "uk.org.lidalia:sysout-over-slf4j", version = "1.0.2" }

commons-io = { module = "commons-io:commons-io", version = "2.22.0" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
guava = { module = "com.google.guava:guava", version = "33.7.2-jre" }
picocli = { module = "info.picocli:picocli", version = "4.7.7" }
# 20220320 had CVE-2022-45688 and CVE-2023-5072 (fixed in 20231013)
json = { module = "org.json:json", version = "20260814" }
everit-json-schema = { module = "com.github.erosb:everit-json-schema", version = "1.14.6" }
mslinks = { module = "com.github.vatbub:mslinks", version = "1.0.6.2" }
# 4.0.0 (2018) had CVE-2019-12415; POI 5 logs through log4j-api, routed to SLF4J by log4j-to-slf4j
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version = "5.5.1" }
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version = "2.26.1" }
jave-core = { module = "ws.schild:jave-core", version.ref = "jave" }
# ffmpeg binaries, one per platform of the distributions (each distribution keeps its own, see build.gradle)
jave-nativebin-win64 = { module = "ws.schild:jave-nativebin-win64", version.ref = "jave" }
jave-nativebin-linux64 = { module = "ws.schild:jave-nativebin-linux64", version.ref = "jave" }
jave-nativebin-osx64 = { module = "ws.schild:jave-nativebin-osx64", version.ref = "jave" }
jave-nativebin-osxm1 = { module = "ws.schild:jave-nativebin-osxm1", version.ref = "jave" }
jave-nativebin-linux-arm64 = { module = "ws.schild:jave-nativebin-linux-arm64", version.ref = "jave" }
# Bundles the Monte Screen Recorder classes (org.monte.*) used to record videos of the games
video-recorder-core = { module = "com.automation-remarks:video-recorder-core", version = "2.0" }
tobii-stream-engine = { module = "com.github.GazePlay:TobiiStreamEngineForJava", version = "5.0" }
rxtx = { module = "org.rxtx:rxtx", version = "2.1.7" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
openjfx-monocle = { module = "org.testfx:openjfx-monocle", version.ref = "monocle" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
lombok = { id = "io.freefair.lombok", version = "9.8.2" }
license-report = { id = "com.github.jk1.dependency-license-report", version = "3.1.4" }
spotbugs = { id = "com.github.spotbugs", version = "6.5.13" }
release = { id = "net.researchgate.release", version = "3.2.0" }
download = { id = "de.undercouch.download", version = "5.7.0" }
