// Acquisition of the gaze: samples (GazeSample), events fired on the nodes (GazeEvent) and the eye tracker seen as
// GazeSource (Tobii; EyeTribe was removed in October 2026), with its native libraries. The dispatch of the samples to the nodes of a game stays in
// gazeplay-commons (AbstractGazeDeviceManager), since it records the statistics of the game. The packages are those of
// gazeplay-commons, where these classes were before.

dependencies {
    implementation libs.tobii.stream.engine
}
