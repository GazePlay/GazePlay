import org.apache.tools.ant.filters.ReplaceTokens

dependencies {
    implementation project(':gazeplay-results')
    implementation project(':gazeplay-gaze')
    implementation project(':gazeplay-commons')
    implementation project(':gazeplay-games-commons')
    implementation libs.gson
    // JAVE (ffmpeg): conversion of the screen recordings for the screen of the areas of interest
    implementation(libs.jave.core) {
        // commons-logging API provided by jcl-over-slf4j (duplicate classes otherwise)
        exclude group: 'commons-logging'
    }
    runtimeOnly libs.jave.nativebin.win64
    runtimeOnly libs.jave.nativebin.linux64
    runtimeOnly libs.jave.nativebin.osx64
    runtimeOnly libs.jave.nativebin.osxm1
    runtimeOnly libs.jave.nativebin.linux.arm64
    implementation libs.commons.io
    implementation libs.json
    implementation(libs.everit.json.schema) {
        // commons-logging API provided by jcl-over-slf4j (duplicate classes otherwise)
        exclude group: 'commons-logging'
    }
    implementation libs.mslinks
    implementation libs.picocli

    runtimeOnly project(':gazeplay-games')

    // Logging of the application: logback, plus bridges for the libraries using commons-logging or log4j 1
    implementation libs.sysout.over.slf4j
    runtimeOnly libs.logback.classic
    runtimeOnly libs.slf4j.jcl
    runtimeOnly libs.slf4j.log4j
    runtimeOnly libs.log4j.to.slf4j

    testImplementation testFixtures(project(':gazeplay-commons'))
}

// Captured here: the configuration cache cannot serialize a reference to the build script used when the jar is written
def runtimeClasspathFiles = configurations.runtimeClasspath

jar {
    manifest {
        attributes(
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": "Univ. Grenoble Alpes - LIG - GETALP",
                "Main-Class": 'net.gazeplay.GazePlayLauncher',
                // Lazy: resolved when the jar is written, not when the project is configured
                "Class-Path": "${-> runtimeClasspathFiles.collect { it.getName() }.join(' ')}",
                "JavaFX-Version": libs.versions.javafx.get(),
                "Built-By": System.properties['user.name']
        )
    }
}

tasks.jar.dependsOn('createLicence')

def generatedLicenceDir = "$buildDir/generated/resources/licence"

task createLicence(type: Copy, group: 'license') {
    from("${rootDir}/gradle/templates/licence.txt")
    expand([
            "version": version,
            "date"   : new Date().format('yyyy-MM-dd')
    ])
    into("$generatedLicenceDir/data/common")
}

// Ajouter ce dossier dans les ressources du projet
sourceSets.main.resources.srcDir generatedLicenceDir

// Assure que processResources attend bien la licence
tasks.named('processResources') {
    dependsOn createLicence
}

// Catalogs of the games and of the GazePlay Eval evaluations: the *SpecSource classes of gazeplay-games, read by
// CatalogBasedGamesLocator. Everything is resolved when the build is configured (no access to the project during the
// execution, deprecated by Gradle), the inputs are declared (the catalogs are regenerated only when a source changes)
// and the lists are sorted (reproducible builds).
def generatedResources = layout.buildDirectory.dir('generated-resources/main')
def gamesJavaSources = project(':gazeplay-games').layout.projectDirectory.dir('src/main/java').asFile

def registerCatalogTask = { String taskName, String fileName, boolean evaluations ->
    def catalogFile = generatedResources.map { it.file(fileName) }
    tasks.register(taskName) {
        inputs.dir(gamesJavaSources).withPathSensitivity(PathSensitivity.RELATIVE)
        outputs.file(catalogFile)
        doLast {
            def root = gamesJavaSources.toPath()
            def classes = java.nio.file.Files.walk(root).withCloseable { paths ->
                paths.map { root.relativize(it).toString().replace(File.separator, '/') }
                    .filter { it.endsWith('.java') && it.contains('SpecSource') }
                    .filter { it.contains('GazeplayEval') == evaluations }
                    .map { it.replace('/', '.').replace('.java', '') }
                    .sorted()
                    .collect(java.util.stream.Collectors.toList())
            }
            def file = catalogFile.get().asFile
            file.parentFile.mkdirs()
            file.text = classes.collect { it + '\n' }.join('')
        }
    }
}
registerCatalogTask('generateGamesCatalog', 'games-catalog.txt', false)
registerCatalogTask('generateEvalsCatalog', 'evals-catalog.txt', true)

sourceSets.main.output.dir(generatedResources, builtBy: ['generateGamesCatalog', 'generateEvalsCatalog'])

// The launch tests start the real application in child JVMs: slower, run separately (also in the CI)
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'smoke', 'all-games'
    }
}

tasks.register('smokeTest', Test) {
    description = 'Launches GazePlay without window (menu, then a game) and checks that it starts without error.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'smoke'
    }
    def smokeHome = layout.buildDirectory.dir('smoke-home').get().asFile
    systemProperty 'smoke.home', smokeHome.absolutePath
    doFirst {
        smokeHome.deleteDir()
        smokeHome.mkdirs()
    }
}

tasks.register('allGamesTest', Test) {
    description = 'Launches each game of the catalog without window, with its first variant, and checks that it starts without error.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'all-games'
    }
    def allGamesHome = layout.buildDirectory.dir('all-games-home').get().asFile
    systemProperty 'smoke.home', allGamesHome.absolutePath
    doFirst {
        allGamesHome.deleteDir()
        allGamesHome.mkdirs()
    }
}
