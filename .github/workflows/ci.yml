name: Continuous Integration

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run SpotBugs
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace --info spotbugsMain

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Spotbugs Reports
          path: '**/build/spotbugs/'

  test:
    # The JavaFX media of the tests (17.0.20) plays audio with the ffmpeg of the system up to ffmpeg 5 (libavcodec 59):
    # Ubuntu 22.04 has ffmpeg 4.4, Ubuntu 24.04 (ubuntu-latest) ffmpeg 6.1, which it cannot use
    runs-on: ubuntu-22.04

    # 17: bundled runtime and bytecode target; 21: next LTS, to know when the runtime can move (see MODERNIZATION.md)
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }} (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}

      # JavaFX tests (TestFX ApplicationExtension) need a display; JavaFX media needs the ffmpeg libraries of the system
      # (without them the background music fails to load and the launch test reports the error)
      - name: Install virtual X server and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg

      # The runners have no sound card: JavaFX media (GStreamer, ALSA output) cannot create a player without one.
      # A PulseAudio null sink, reached by ALSA through the pulse plugin, gives it a virtual audio output
      - name: Start a virtual audio output
        run: |
          sudo apt-get install -y pulseaudio libasound2-plugins
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_output
          pactl set-default-sink virtual_output
          echo 'pcm.!default { type pulse }' | sudo tee /etc/asound.conf
          echo 'ctl.!default { type pulse }' | sudo tee -a /etc/asound.conf

      # Tests are hermetic: Gradle points user.home and the edition file to build/test-home (see build.gradle)
      - name: Run tests
        run: |
          chmod +x ./gradlew
          xvfb-run --auto-servernum ./gradlew --stacktrace --continue :gazeplay-results:test :gazeplay-gaze:test :gazeplay-commons:test :gazeplay-games-commons:test :gazeplay-core:test :gazeplay-games:test :gazeplay-core:smokeTest

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Reports (JDK ${{ matrix.java }})
          path: '**/build/reports/tests/'

  # Builds the real Linux distribution (bundled JRE and Tobii drivers, downloads checked against their SHA-256) and
  # starts GazePlay with its launcher script, as a user would
  package-linux:
    # Pinned: the virtual audio output (PulseAudio, ffmpeg) was checked on Ubuntu 24.04; ubuntu-latest moves to Ubuntu 26
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      # The bundled runtime (Zulu 21 with JavaFX 23) plays audio with the ffmpeg of the system (ffmpeg 6 supported)
      - name: Install virtual X server and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg

      # The runners have no sound card: JavaFX media (GStreamer, ALSA output) cannot create a player without one.
      # A PulseAudio null sink, reached by ALSA through the pulse plugin, gives it a virtual audio output
      - name: Start a virtual audio output
        run: |
          sudo apt-get install -y pulseaudio libasound2-plugins
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_output
          pactl set-default-sink virtual_output
          echo 'pcm.!default { type pulse }' | sudo tee /etc/asound.conf
          echo 'ctl.!default { type pulse }' | sudo tee -a /etc/asound.conf

      - name: Build the Linux distribution
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace linuxDistTar

      - name: Launch GazePlay from the distribution
        run: |
          mkdir -p /tmp/gazeplay-dist /tmp/gazeplay-home/GazePlay
          # Mouse mode: this job checks the distribution and its launcher, not the eye trackers (no device in the CI)
          echo "EYE_TRACKER=mouse_control" > /tmp/gazeplay-home/GazePlay/GazePlay.properties
          tar -xzf build/distributions/gazeplay-linux-x64-*.tar.gz -C /tmp/gazeplay-dist
          cd /tmp
          # Started from another folder than bin/, without terminal, with a fresh home: it must still be running after 40 s.
          # Java takes user.home from the account database, not from $HOME: it is given through JAVA_TOOL_OPTIONS, read
          # by the JVM whatever the launcher script ($HOME is kept: the audio output needs the PulseAudio of the user)
          set +e
          JAVA_TOOL_OPTIONS=-Duser.home=/tmp/gazeplay-home timeout 40 xvfb-run --auto-servernum \
            sh /tmp/gazeplay-dist/gazeplay-linux-x64-*/bin/gazeplay-linux.sh --default-user < /dev/null > /tmp/gazeplay.log 2>&1
          status=$?
          set -e
          # The launcher turns the console log off: the log of GazePlay is in its folder
          LOG=/tmp/gazeplay-home/GazePlay/gazeplay.log
          tail -50 /tmp/gazeplay.log; tail -50 "$LOG" || echo "No log in $LOG"
          if [ "$status" != "124" ]; then echo "GazePlay stopped (exit code $status)"; exit 1; fi
          grep -q "Games found : " "$LOG" || { echo "The game catalog was not loaded"; exit 1; }
          if cat /tmp/gazeplay.log "$LOG" | grep -E "Exception| ERROR " | grep -vE "NoSuchFileException|UnixException|at java.base/|ConfigurationSource"; then
            echo "Unexpected errors"; exit 1
          fi
