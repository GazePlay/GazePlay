name: Continuous Integration

on: [push, pull_request]

# Each job has a time limit (default: 6 hours): on 2026-10-22 a job hung for 2 hours on "apt-get update" (unreachable
# Ubuntu mirror, see .github/scripts/install-apt-packages.sh). The jobs usually take 2 to 13 minutes
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Run SpotBugs
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace --info spotbugsMain

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Spotbugs Reports
          path: '**/build/spotbugs/'

  test:
    # The JavaFX media of the tests (21.0.13) plays audio with the ffmpeg of the system, up to ffmpeg 6 (Ubuntu 24.04 has
    # 6.1). Pinned like package-linux: ubuntu-latest moves to Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # 25: bytecode target and Java of the bundled runtimes; 26: latest Java, to see the next changes coming
    strategy:
      fail-fast: false
      matrix:
        java: [ '25', '26' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }} (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}

      # JavaFX tests (TestFX ApplicationExtension) need a display; JavaFX media needs the ffmpeg libraries of the system
      # (without them the background music fails to load and the launch test reports the error), and an audio output
      # (PulseAudio, below). The script limits each attempt in time and changes of mirror if one hangs
      - name: Install virtual X server, ffmpeg and PulseAudio
        timeout-minutes: 15
        run: bash .github/scripts/install-apt-packages.sh xvfb ffmpeg pulseaudio libasound2-plugins

      # The runners have no sound card: JavaFX media (GStreamer, ALSA output) cannot create a player without one.
      # A PulseAudio null sink, reached by ALSA through the pulse plugin, gives it a virtual audio output
      - name: Start a virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_output
          pactl set-default-sink virtual_output
          echo 'pcm.!default { type pulse }' | sudo tee /etc/asound.conf
          echo 'ctl.!default { type pulse }' | sudo tee -a /etc/asound.conf

      # Tests are hermetic: Gradle points user.home and the edition file to build/test-home (see build.gradle)
      - name: Run tests
        run: |
          chmod +x ./gradlew
          xvfb-run --auto-servernum ./gradlew --stacktrace --continue :gazeplay-results:test :gazeplay-gaze:test :gazeplay-commons:test :gazeplay-games-commons:test :gazeplay-core:test :gazeplay-games:test :gazeplay-core:smokeTest

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Reports (JDK ${{ matrix.java }})
          path: '**/build/reports/tests/'

  # Launches each game of the catalog with its first variant, as the menu does, and checks that it starts without error
  # (AllGamesLaunchTest, about 7 minutes): most games have no other test
  all-games:
    # Same system as the test job (audio through the ffmpeg of Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Install virtual X server, ffmpeg and PulseAudio
        timeout-minutes: 15
        run: bash .github/scripts/install-apt-packages.sh xvfb ffmpeg pulseaudio libasound2-plugins

      # See the test job
      - name: Start a virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_output
          pactl set-default-sink virtual_output
          echo 'pcm.!default { type pulse }' | sudo tee /etc/asound.conf
          echo 'ctl.!default { type pulse }' | sudo tee -a /etc/asound.conf

      - name: Launch every game
        run: |
          chmod +x ./gradlew
          xvfb-run --auto-servernum ./gradlew --stacktrace :gazeplay-core:allGamesTest

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: All games launch reports
          path: '**/build/reports/tests/allGamesTest/'

  # Builds the real Linux distribution (bundled JRE and Tobii drivers, downloads checked against their SHA-256) and
  # starts GazePlay with its launcher script, as a user would
  package-linux:
    # Pinned: the virtual audio output (PulseAudio, ffmpeg) was checked on Ubuntu 24.04; ubuntu-latest moves to Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      # The bundled runtime (Zulu 25 with JavaFX 25) plays audio with the ffmpeg of the system, through PulseAudio
      # (below). The script limits each attempt in time and changes of mirror if one hangs
      - name: Install virtual X server, ffmpeg and PulseAudio
        timeout-minutes: 15
        run: bash .github/scripts/install-apt-packages.sh xvfb ffmpeg pulseaudio libasound2-plugins

      # The runners have no sound card: JavaFX media (GStreamer, ALSA output) cannot create a player without one.
      # A PulseAudio null sink, reached by ALSA through the pulse plugin, gives it a virtual audio output
      - name: Start a virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual_output
          pactl set-default-sink virtual_output
          echo 'pcm.!default { type pulse }' | sudo tee /etc/asound.conf
          echo 'ctl.!default { type pulse }' | sudo tee -a /etc/asound.conf

      - name: Build the Linux distribution
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace linuxDistTar

      # The distribution with its bundled runtime (Zulu 25, JavaFX 25): what the users get. The menu, then a game.
      # The game needs its variant: with --game alone, GazePlay waits on the variant dialog and the game never runs
      - name: Launch GazePlay from the distribution (menu, then a game)
        run: |
          mkdir -p /tmp/gazeplay-dist
          tar -xzf build/distributions/gazeplay-linux-x64-*.tar.gz -C /tmp/gazeplay-dist
          launcher=$(ls /tmp/gazeplay-dist/gazeplay-linux-x64-*/bin/gazeplay-linux.sh)
          xvfb-run --auto-servernum bash .github/scripts/launch-distribution.sh "$launcher" /tmp/gazeplay-home --default-user
          xvfb-run --auto-servernum bash .github/scripts/launch-distribution.sh "$launcher" /tmp/gazeplay-home-game \
            --default-user --game WhereIsTheShape --variant DimensionDifficultyGameVariant:2:2:Easy

  # Same check for Windows x64, the main platform of GazePlay
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Build the Windows distribution
        shell: pwsh
        run: ./gradlew.bat --stacktrace windowsDistZip

      - name: Launch GazePlay from the distribution (menu, then a game)
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "gazeplay-dist"
          $zip = Get-ChildItem build/distributions/gazeplay-windows-x64-*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath $dist
          $launcher = (Get-ChildItem "$dist/*/bin/gazeplay-windows.bat" | Select-Object -First 1).FullName
          ./.github/scripts/launch-distribution.ps1 -Launcher $launcher -GazeHome (Join-Path $env:RUNNER_TEMP "gazeplay-home") -Arguments "--default-user"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/launch-distribution.ps1 -Launcher $launcher -GazeHome (Join-Path $env:RUNNER_TEMP "gazeplay-home-game") -Arguments "--default-user --game WhereIsTheShape --variant DimensionDifficultyGameVariant:2:2:Easy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Same check for macOS: the GitHub runners are Apple Silicon machines, hence the aarch64 distribution
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Build the macOS Apple Silicon distribution
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace macosAarch64DistTar

      - name: Launch GazePlay from the distribution (menu, then a game)
        run: |
          mkdir -p /tmp/gazeplay-dist
          tar -xzf build/distributions/gazeplay-macos-aarch64-*.tar.gz -C /tmp/gazeplay-dist
          launcher=$(ls /tmp/gazeplay-dist/gazeplay-macos-aarch64-*/bin/gazeplay-macos.sh)
          bash .github/scripts/launch-distribution.sh "$launcher" /tmp/gazeplay-home --default-user
          bash .github/scripts/launch-distribution.sh "$launcher" /tmp/gazeplay-home-game --default-user --game WhereIsTheShape --variant DimensionDifficultyGameVariant:2:2:Easy
