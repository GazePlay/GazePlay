name: Release GazePlay

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch  
    
jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:

      - name: Show version type selected
        run: echo "Version selected is -> ${{ github.event.inputs.bump }}"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main as of 2026-10-20, pinned
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Download JREs
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace --info downloadAndExtractJREs
          chmod -R 777 build/jre
      - name: Setup Git Config
        run: |
          git config --global user.email "ci@gazeplay.net"
          git config --global user.name "GazePlay Automation"
          
      - name: Generate Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --stacktrace --info release
          
      - name: Rename Releases
        run: |
          cd ./build/distributions/
          mv gazeplay-linux-x64*.tar.gz gazeplay-linux-x64.tar.gz
          # aarch64 first: "gazeplay-macos*" would also match it
          mv gazeplay-macos-aarch64-*.tar.gz gazeplay-macos-aarch64.tar.gz
          mv gazeplay-macos-[0-9]*.tar.gz gazeplay-macos.tar.gz
          mv gazeplay-arm*.tar.gz gazeplay-arm.tar.gz
          mv gazeplay-windows-x64*.zip gazeplay-windows-x64.zip
          mv gazeplay-windows-x64*installer.exe gazeplay-windows-x64-installer.exe
          mv gazeplay-no-jre*.zip gazeplay-no-jre.zip          
          
      - name: Get Env
        run: |
          echo "REPO_NAME=${{ github.repository }}" >> $GITHUB_ENV
          echo "REPO_BASENAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV
          
      - name: New tag
        id: new-tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/${{ env.REPO_NAME }}/releases/latest | jq -r .tag_name)
          version="${latest_tag#v}"  # strip leading 'v'
          IFS='.' read -r major minor patch <<< "$version"

          case "${{ github.event.inputs.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              nexPatch=$((patch + 1))
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              nexPatch=$((patch + 1))
              ;;
            patch)
              patch=$((patch + 1))
              nexPatch=$((patch + 1))
              ;;
            *)
              echo "Option invalide: $bump"
              exit 1
              ;;
          esac

          new_tag="v$major.$minor.$patch"
          next_tag="$major.$minor.$nexPatch"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT
          echo "nextTag=$next_tag" >> $GITHUB_OUTPUT

      - name: Update version project for gradle
        run: |
          version="${{ steps.new-tag.outputs.nextTag }}"

          if grep -q '^version=' gradle.properties; then
            sed -i "s/^version=.*/version=${version}/" gradle.properties
          else
            echo "version=${version}" >> gradle.properties
          fi

      - name: Setup next release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gradle.properties
          git commit -m "Setup next release for gradle"
          git push
          
      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0, pinned
        with:
          tag: ${{ steps.new-tag.outputs.tag }}
          name: ${{ env.REPO_BASENAME }} ${{ steps.new-tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: "master"
          prerelease: true
          draft: false
          artifacts: "./build/distributions/gazeplay-linux-x64.tar.gz,./build/distributions/gazeplay-macos.tar.gz,./build/distributions/gazeplay-macos-aarch64.tar.gz,./build/distributions/gazeplay-arm.tar.gz,./build/distributions/gazeplay-windows-x64.zip,./build/distributions/gazeplay-windows-x64-installer.exe,./build/distributions/gazeplay-no-jre.zip"
