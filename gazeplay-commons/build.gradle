apply plugin: 'java-test-fixtures'

// Test fixtures (TestingUtils, shared test resources) see the same libraries as the main code, JavaFX included
configurations.testFixturesImplementation.extendsFrom(configurations.implementation)

dependencies {
    implementation project(':gazeplay-results')
    implementation project(':gazeplay-gaze')
    implementation libs.commons.io
    implementation libs.gson
    implementation libs.guava
    // Bundles the Monte Screen Recorder classes (org.monte.*) used by Stats to record videos of the games
    implementation(libs.video.recorder.core) {
        // Only its bundled Monte Screen Recorder classes (org.monte.*) are used, and they reference none of its
        // dependencies (checked in the bytecode): owner-java8 (duplicate classes of owner), zt-exec, commons-lang3,
        // awaitility, hamcrest, objenesis and the vulnerable log4j 1.2.17 are not shipped
        transitive = false
    }



}

// Captured here: the configuration cache cannot serialize a reference to the build script used when the jar is written
def runtimeClasspathFiles = configurations.runtimeClasspath

jar {
    manifest {
        attributes(
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": "Univ. Grenoble Alpes - LIG - GETALP",
                // Lazy: resolved when the jar is written, not when the project is configured
                "Class-Path": "${-> runtimeClasspathFiles.collect { it.getName() }.join(' ')}",
                "JavaFX-Version": libs.versions.javafx.get(),
                "Built-By": System.properties['user.name']
        )
    }
}

test {
    exclude '**/VersionInfoTest.class'
}
